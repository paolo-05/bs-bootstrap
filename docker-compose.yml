services:
  postgres:
    image: postgres:16
    container_name: imdb_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker-init/01_import_sql.sh:/docker-entrypoint-initdb.d/01_import_sql.sh:ro
      - ./${BOOTSTRAP_SQL:-imdb_small.sql}:/docker-bootstrap/imdb.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo:
    image: mongo:7
    container_name: imdb_mongo
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-imdb_root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-imdb_root_password}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-imdb}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - ./docker-init/02_import_mongo.sh:/docker-entrypoint-initdb.d/02_import_mongo.sh:ro
      - ./movie.json:/docker-bootstrap/movie.json:ro

volumes:
  postgres_data:
  mongo_data:
